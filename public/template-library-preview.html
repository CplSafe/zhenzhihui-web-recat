<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>模板库预览 - 帧智汇</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #f7f9f9;
        color: #202b2a;
        font-family: 'Microsoft YaHei', sans-serif;
      }
      button,
      input {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      .shell {
        display: flex;
        min-height: 100vh;
      }
      .side {
        width: 220px;
        background: #fff;
        border-right: 1px solid #eaf0ee;
        flex-shrink: 0;
        padding: 22px 14px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 0 8px 36px;
      }
      .brand img {
        width: 35px;
        height: 40px;
        object-fit: contain;
      }
      .brand b {
        display: block;
        font-size: 17px;
      }
      .brand small {
        color: #24a78a;
        font-size: 11px;
      }
      .nav-label {
        font-size: 12px;
        color: #86918f;
        margin: 26px 10px 10px;
      }
      .nav-item {
        display: block;
        text-decoration: none;
        color: #687572;
        padding: 11px 12px;
        font-size: 14px;
        border-radius: 8px;
      }
      .nav-item.active {
        background: #e3f8f1;
        color: #079c7c;
        font-weight: 600;
      }
      .main {
        flex: 1;
        min-width: 0;
      }
      .top {
        height: 64px;
        background: #fff;
        border-bottom: 1px solid #eaf0ee;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 38px;
      }
      .top span {
        color: #788783;
        font-size: 13px;
      }
      .avatar {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: #16b999;
        color: #fff;
        display: grid;
        place-items: center;
      }
      .content {
        max-width: 1500px;
        margin: auto;
        padding: 42px 40px 70px;
      }
      .heading h1 {
        font-size: 28px;
        margin: 0 0 9px;
        letter-spacing: -0.02em;
      }
      .heading p {
        margin: 0;
        color: #778582;
        font-size: 14px;
      }
      .notice {
        display: inline-block;
        margin-top: 17px;
        color: #678078;
        font-size: 12px;
      }
      .controls {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-top: 34px;
      }
      .tabs {
        display: flex;
        gap: 8px;
        overflow: auto;
      }
      .tabs button {
        white-space: nowrap;
        border: 0;
        background: transparent;
        padding: 9px 15px;
        color: #687673;
        border-radius: 8px;
      }
      .tabs button.active {
        background: #dcf6ee;
        color: #06886d;
        font-weight: 600;
      }
      .search {
        width: 250px;
        border: 1px solid #e1e9e6;
        border-radius: 9px;
        background: #fff;
        padding: 10px 13px;
        outline: none;
      }
      .search:focus {
        border-color: #1bbd98;
      }
      .section-head {
        display: flex;
        align-items: end;
        justify-content: space-between;
        margin: 35px 0 18px;
      }
      .section-head h2 {
        font-size: 19px;
        margin: 0;
      }
      .section-head p {
        margin: 0;
        color: #91a09c;
        font-size: 12px;
      }
      .grid {
        column-count: 4;
        column-gap: 20px;
      }
      .card {
        display: inline-block;
        width: 100%;
        margin: 0 0 20px;
        break-inside: avoid;
        background: #1d302b;
        border: 0;
        border-radius: 12px;
        overflow: hidden;
        text-align: left;
        padding: 0;
        color: inherit;
        min-width: 0;
      }
      .card:hover {
        border-color: #a4dbcd;
        transform: translateY(-2px);
      }
      .cover {
        position: relative;
        aspect-ratio: 4/3;
        background: #eaf2ef;
        overflow: hidden;
      }
      .cover img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.25s ease;
      }
      .card:hover .cover img {
        transform: scale(1.035);
      }
      .badge {
        position: absolute;
        top: 12px;
        left: 12px;
        padding: 5px 9px;
        background: rgba(26, 38, 35, 0.74);
        color: white;
        border-radius: 5px;
        font-size: 11px;
      }
      .play {
        position: absolute;
        right: 12px;
        top: 12px;
        color: white;
        background: rgba(20, 30, 27, 0.68);
        width: 28px;
        height: 28px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        font-size: 12px;
      }
      .card-body {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 46px 16px 16px;
        background: linear-gradient(transparent, rgba(9, 17, 15, 0.88));
        color: #fff;
      }
      .card h3 {
        margin: 0;
        font-size: 15px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .card p {
        font-size: 12px;
        color: rgba(255, 255, 255, 0.84);
        margin: 6px 0 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .empty {
        padding: 55px;
        text-align: center;
        color: #81908c;
      }
      .dialog {
        border: 0;
        border-radius: 14px;
        max-width: 760px;
        width: calc(100% - 32px);
        padding: 0;
        color: #26322f;
      }
      .dialog::backdrop {
        background: rgba(14, 23, 20, 0.62);
      }
      .dialog-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 19px 22px;
      }
      .dialog-head h2 {
        font-size: 18px;
        margin: 0;
      }
      .close {
        border: 0;
        background: #f0f4f2;
        border-radius: 6px;
        padding: 5px 10px;
      }
      .dialog video {
        width: 100%;
        max-height: 58vh;
        background: #111;
        display: block;
      }
      .dialog-copy {
        padding: 18px 22px 23px;
        color: #73817d;
        font-size: 14px;
      }
      .dialog-copy strong {
        display: block;
        color: #25332f;
        margin-bottom: 8px;
      }
      .dialog-copy p {
        margin: 0;
      }
      .dialog-copy small {
        display: block;
        margin-top: 15px;
        color: #9ba6a3;
      }
      .mobile-bar {
        display: none;
      }
      @media (max-width: 1100px) {
        .grid {
          column-count: 3;
        }
      }
      @media (max-width: 760px) {
        .side {
          display: none;
        }
        .top {
          height: 58px;
          padding: 0 18px;
        }
        .content {
          padding: 30px 18px 50px;
        }
        .heading h1 {
          font-size: 24px;
        }
        .controls {
          align-items: stretch;
          flex-direction: column;
          margin-top: 26px;
        }
        .search {
          width: 100%;
        }
        .tabs {
          gap: 2px;
        }
        .tabs button {
          padding: 8px 12px;
        }
        .section-head {
          margin-top: 27px;
        }
        .grid {
          column-count: 2;
          column-gap: 12px;
        }
        .card {
          margin-bottom: 12px;
        }
        .card-body {
          padding: 38px 12px 12px;
        }
        .card h3 {
          font-size: 14px;
        }
        .card p {
          line-height: 1.4;
        }
        .mobile-bar {
          display: block;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <aside class="side">
        <div class="brand">
          <img src="/favicon-doudou.png" alt="" />
          <div><b>豆豆同学</b><small>Framora · 帧智汇</small></div>
        </div>
        <div class="nav-label">创作</div>
        <a class="nav-item" href="/hot-copy">爆款复刻</a><a class="nav-item" href="/smart">爆款成片</a
        ><a class="nav-item" href="/canvas">无限画布</a>
        <div class="nav-label">发现</div>
        <span class="nav-item active">模板库</span><a class="nav-item" href="/resources">素材市场</a>
        <div class="nav-label">我的</div>
        <a class="nav-item" href="/projects">项目管理</a>
      </aside>
      <main class="main">
        <header class="top">
          <b class="mobile-bar">豆豆同学</b><span>创作 / 模板库</span>
          <div class="avatar">豆</div>
        </header>
        <div class="content">
          <div class="heading">
            <h1>模板库</h1>
            <p>从一个好案例开始，找到适合你的创作灵感。</p>
            <span class="notice">页面预览 · 以下内容为示例</span>
          </div>
          <div class="controls">
            <nav class="tabs" aria-label="模板分类">
              <button class="active" data-category="全部" aria-pressed="true">全部</button
              ><button data-category="商品展示" aria-pressed="false">商品展示</button
              ><button data-category="品牌宣传" aria-pressed="false">品牌宣传</button
              ><button data-category="生活方式" aria-pressed="false">生活方式</button
              ><button data-category="创意短片" aria-pressed="false">创意短片</button>
            </nav>
            <input class="search" type="search" placeholder="搜索模板名称" aria-label="搜索模板名称" />
          </div>
          <div class="section-head">
            <h2>精选模板</h2>
            <p id="count"></p>
          </div>
          <section class="grid" aria-label="模板列表"></section>
          <div class="empty" hidden>没有找到相关模板，试试其他关键词。</div>
        </div>
      </main>
    </div>
    <dialog class="dialog">
      <div class="dialog-head">
        <h2 id="detail-title">模板详情</h2>
        <button class="close" aria-label="关闭详情">✕</button>
      </div>
      <video controls playsinline preload="metadata"></video>
      <div class="dialog-copy">
        <strong>模板简介</strong>
        <p id="detail-text"></p>
        <small>示例页面，仅用于展示模板库布局。</small>
      </div>
    </dialog>
    <script>
      const base = 'https://zzh-zhongdahengrui.oss-accelerate.aliyuncs.com/'
      const data = [
        ['光影里的产品', '商品展示', '用简洁镜头展示产品细节', '2764a7e5761828c5abe96803a506a1e8', '9/16'],
        ['城市生活片段', '生活方式', '记录平凡生活中的美好时刻', '2b3e62962a9dd1ae22237405dde1eac2', '9/16'],
        ['品牌故事短片', '品牌宣传', '以画面讲述品牌的温度', '2e566af27e73e1e60a1d46d0f83610c9', '9/16'],
        ['一日灵感记录', '创意短片', '适合社交媒体的创意表达', '3500604259d134a4aa065935ffeef88a', '16/9'],
        ['日常好物分享', '商品展示', '突出产品质感与使用场景', '3abbda6c6f7e70e40b5d5e239efe27e3', '16/9'],
        ['生活的另一面', '生活方式', '捕捉自然、轻松的生活氛围', '43b9af91d1e89a990ae7f28cee861b52', '9/16'],
        ['品牌视觉印象', '品牌宣传', '用镜头传递品牌气质', '4e066c8a05608916b7a8152cb339b5d9', '9/16'],
        ['有趣的瞬间', '创意短片', '把灵感变成生动的短片', '5a5daddaade7d7d6a8ac1299f449bb4a', '9/16'],
      ]
      let category = '全部',
        query = ''
      const grid = document.querySelector('.grid'),
        empty = document.querySelector('.empty'),
        dialog = document.querySelector('dialog'),
        video = dialog.querySelector('video')
      function render() {
        grid.replaceChildren()
        const shown = data.filter((x) => (category === '全部' || x[1] === category) && x[0].includes(query))
        document.querySelector('#count').textContent = `${shown.length} 个示例`
        empty.hidden = shown.length > 0
        shown.forEach((x) => {
          const b = document.createElement('button')
          b.className = 'card'
          b.type = 'button'
          const url = base + x[3] + '.mp4'
          b.innerHTML = `<div class="cover" style="aspect-ratio:${x[4]}"><img loading="lazy" alt="" src="${url}?x-oss-process=video/snapshot,t_1000,f_jpg,w_500"><span class="badge">${x[1]}</span><span class="play">▶</span><div class="card-body"><h3>${x[0]}</h3><p>${x[2]}</p></div></div>`
          b.onclick = () => {
            document.querySelector('#detail-title').textContent = x[0]
            document.querySelector('#detail-text').textContent = x[2]
            video.src = url
            dialog.showModal()
          }
          grid.append(b)
        })
      }
      document.querySelectorAll('.tabs button').forEach(
        (b) =>
          (b.onclick = () => {
            category = b.dataset.category
            document.querySelectorAll('.tabs button').forEach((t) => {
              t.classList.toggle('active', t === b)
              t.setAttribute('aria-pressed', String(t === b))
            })
            render()
          }),
      )
      document.querySelector('.search').oninput = (e) => {
        query = e.target.value.trim()
        render()
      }
      document.querySelector('.close').onclick = () => dialog.close()
      dialog.addEventListener('close', () => {
        video.pause()
        video.removeAttribute('src')
        video.load()
      })
      render()
    </script>
  </body>
</html>
