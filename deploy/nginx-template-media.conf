# 帧智汇生产站点的模板媒体同源代理。
#
# 必须放在前端 SPA 的 `location / { try_files ... /index.html; }` 之前，
# 并 include 到实际承载 dist 的 server 块中：
#
#   server {
#     ...
#     include /etc/nginx/snippets/zhenzhihui-template-media.conf;
#     location / {
#       try_files $uri $uri/ /index.html;
#     }
#   }
#
# 修改后执行 `nginx -t && systemctl reload nginx`。

location ^~ /template-media/ {
    proxy_pass https://zzh-zhongdahengrui.oss-accelerate.aliyuncs.com/;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_ssl_name zzh-zhongdahengrui.oss-accelerate.aliyuncs.com;

    proxy_set_header Host zzh-zhongdahengrui.oss-accelerate.aliyuncs.com;
    proxy_set_header Origin "";
    proxy_set_header Referer "";

    # 视频预览和导入可能使用 Range 请求。
    proxy_set_header Range $http_range;
    proxy_set_header If-Range $http_if_range;
    proxy_force_ranges on;

    proxy_connect_timeout 10s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    # 同源请求无需 OSS 的跨域头；缓存公开模板，减少重复回源。
    proxy_hide_header Access-Control-Allow-Origin;
    add_header Cache-Control "public, max-age=3600" always;
    add_header X-Content-Type-Options "nosniff" always;
}
